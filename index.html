<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali FF Tool v2</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:#111;border-radius:25px;padding:20px;border:2px solid red;text-align:center}
.imgbox{width:130px;height:130px;border-radius:50%;border:4px solid red;margin:0 auto;overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:cover}
h2{color:red}
.p1{color:#ffcc00;font-weight:bold}
.card{background:#222;border-radius:15px;padding:15px;margin:15px 0;text-align:left}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333}
.row b{color:#ffcc00}
.btn{width:100%;padding:14px;background:red;color:#fff;border:none;border-radius:12px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<div class="imgbox"><img src="ali-photo.jpg"></div>
<h2>ALI GAMING</h2>
<div class="p1">FF SENSITIVITY V2</div>
<div class="card">
<div class="row"><span>General</span><b>100</b></div>
<div class="row"><span>Red Dot</span><b>100</b></div>
<div class="row"><span>2x Scope</span><b>95</b></div>
<div class="row"><span>4x Scope</span><b>90</b></div>
<div class="row"><span>Sniper</span><b>70</b></div>
<div class="row"><span>Free Look</span><b>85</b></div>
<div class="row"><span>DPI</span><b>700</b></div>
<div class="row"><span>Fire Button</span><b>52</b></div>
</div>
<button class="btn">APPLY SENSITIVITY</button>
</div>
</body>
</html>
